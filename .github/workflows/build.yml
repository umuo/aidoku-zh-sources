name: Validate and Deploy Sources

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 旧版 .aix 使用数组索引；直接校验已提交的发布包，避免新版 CLI 生成空列表。
      - name: Validate published packages and indexes
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          public = Path("public")
          index = json.loads((public / "index.json").read_text())
          compact = json.loads((public / "index.min.json").read_text())
          if not isinstance(index, list) or not index or index != compact:
              raise ValueError("Source indexes must be nonempty, identical arrays")
          if len({entry["id"] for entry in index}) != len(index):
              raise ValueError("Duplicate source IDs")

          for entry in index:
              if Path(entry["file"]).name != entry["file"] or Path(entry["icon"]).name != entry["icon"]:
                  raise ValueError("Invalid package or icon filename")
              icon = public / "icons" / entry["icon"]
              if not icon.is_file():
                  raise ValueError(f"Missing icon: {icon}")
              with ZipFile(public / "sources" / entry["file"]) as package:
                  if package.testzip() is not None:
                      raise ValueError(f"Corrupt package: {entry['file']}")
                  info = json.loads(package.read("Payload/source.json"))["info"]
                  for field in ("id", "version", "lang"):
                      if info[field] != entry[field]:
                          raise ValueError(f"Package metadata mismatch: {entry['id']} {field}")
                  wasm = package.read("Payload/main.wasm")
                  if not wasm.startswith(b"\x00asm\x01\x00\x00\x00"):
                      raise ValueError(f"Invalid WebAssembly: {entry['id']}")
                  if entry["id"] == "zh.baozimh2":
                      (Path(os.environ["RUNNER_TEMP"]) / "baozimh2-test.wasm").write_bytes(wasm)
          print(f"Validated {len(index)} source packages")
          PY

      - name: Test published Baozimh2 plugin
        env:
          BAOZIMH2_WASM_PATH: ${{ runner.temp }}/baozimh2-test.wasm
        run: node --test src/rust/zh.baozimh2/tests/reader.test.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
